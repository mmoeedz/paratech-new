<!doctype html><html><head><meta charset="utf-8"><title>ParaTech Letterhead</title>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0}
:root{--obs:#0b0a09;--deep:#14120f;--cop:#c08040;--copl:#d19a5f;--ivory:#f4f1ea;--soft:#b5afa6}
body{width:210mm;height:297mm;position:relative;overflow:hidden;font-family:"DM Sans","Helvetica Neue",Arial,sans-serif;background:#fff;color:var(--deep)}
.hd{position:absolute;top:0;left:0;right:0;height:46mm;background:var(--obs)}
.hd:after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.4mm;background:linear-gradient(90deg,var(--cop),var(--copl) 55%,var(--obs) 100%)}
.brand{position:absolute;left:20mm;top:0;bottom:1.4mm;display:flex;align-items:center;gap:6mm}
.brand img{height:22mm}
.vr{width:.3mm;height:18mm;background:var(--cop)}
.name{font-size:27pt;font-weight:700;letter-spacing:.01em;color:#fff;line-height:1}
.name span{color:var(--cop)}
.sub{font-size:7.5pt;letter-spacing:.34em;text-transform:uppercase;color:var(--soft);margin-top:3mm}
.rt{position:absolute;right:20mm;top:0;bottom:1.4mm;display:flex;align-items:center;text-align:right;font-size:7.5pt;letter-spacing:.22em;text-transform:uppercase;color:var(--copl);line-height:2}
.wmw{position:absolute;inset:0;overflow:hidden}.wm{position:absolute;right:-18mm;bottom:30mm;width:130mm;opacity:.045}
.ft{position:absolute;left:0;right:0;bottom:0;height:34mm;background:var(--obs);color:var(--ivory);font-size:8pt;line-height:1.65}
.ft:before{content:"";position:absolute;left:0;right:0;top:0;height:1.4mm;background:linear-gradient(90deg,var(--obs),var(--copl) 45%,var(--cop))}
.cols{position:absolute;left:20mm;right:20mm;top:7mm;display:flex;justify-content:space-between}
.cols div{width:38%}.cols div:last-child{width:22%;text-align:right}
.cols h6{font-size:6.5pt;letter-spacing:.26em;text-transform:uppercase;color:var(--cop);font-weight:700;margin-bottom:1.2mm}
.legal{position:absolute;left:20mm;right:20mm;bottom:4mm;border-top:.2mm solid #2a2521;padding-top:1.8mm;font-size:6.5pt;color:var(--soft);letter-spacing:.04em}
</style></head><body>
<div class="hd">
 <div class="brand"><img src="mark-white.png"><div class="vr"></div><div><div class="name">Para<span>Tech</span></div><div class="sub">Solutions LLC</div></div></div>
 <div class="rt">AI &amp; Digital<br>Solutions</div>
</div>
<div class="wmw"><img class="wm" src="mark.png"></div>
<div class="ft">
 <div class="cols">
  <div><h6>Address</h6>[Street address]<br>[City], Pakistan</div>
  <div><h6>Contact</h6>[+92 000 0000000]<br>contact@paratechsolutions.com</div>
  <div><h6>Online</h6>www.paratechsolutions.com</div>
 </div>
 <div class="legal">Paratech Solutions LLC &nbsp;·&nbsp; SECP Reg. No. [0000000] &nbsp;·&nbsp; NTN [0000000-0]</div>
</div>
</body></html>
